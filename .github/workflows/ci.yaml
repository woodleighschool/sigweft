---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  check:
    name: Build Success
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: --locked go node pnpm golangci-lint oxfmt jactionlint go:golang.org/x/vuln/cmd/govulncheck

      - name: Resolve caches
        id: cache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cache.outputs.build }}
            ${{ steps.cache.outputs.modules }}
            ${{ steps.cache.outputs.pnpm }}
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.sum', 'web/pnpm-lock.yaml', '.mise/mise.lock', '.golangci.yml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: mise run deps

      - name: Check application
        run: mise run check

      - name: Check dependency vulnerabilities
        run: mise run vulncheck

      - name: Lint workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: jactionlint --online --shellcheck= --format github .github/workflows/*.yaml

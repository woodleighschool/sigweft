monorepo_root = true

[tools]
go = "1.27.4"
node = "26.13.1"
pnpm = "12.18.0"
golangci-lint = "2.15.0"
lefthook = "2.2.2"
jactionlint = "v2.5.0"
oxfmt = "0.75.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
"go:github.com/google/go-licenses/v2" = "v2.0.1"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["web"]

[tasks.go-deps]
run = "go mod download"

[tasks.deps]
depends = ["go-deps", "//web:deps"]

[tasks.dev]
run = { tasks = ["dev-backend", "//web:dev"] }

[tasks.dev-backend]
env.SIGWEFT_LISTEN = "127.0.0.1:8787"
run = 'go run ./cmd/sigweft serve --config "${SIGWEFT_CONFIG:-examples/studio/sigweft.yaml}"'

[tasks.build]
description = "Build the web bundle and backend binary"
depends = ["//web:build"]
run = { task = "backend" }

[tasks.backend]
run = "go build -o sigweft ./cmd/sigweft"

[tasks.validate]
run = "go run ./cmd/sigweft validate --config examples/studio/sigweft.yaml"

[tasks.generate]
run = [
  "go run ./cmd/sigweft schema > sigweft.schema.json",
  "go run ./cmd/sigweft openapi > web/openapi.json",
  { task = "//web:openapi-types" },
]

[tasks.frontend-check]
description = "Verify the web app and generated contracts"
depends = ["generate"]
run = [
  '''
generated_status=$(git status --short --untracked-files=all -- sigweft.schema.json web/openapi.json web/src/lib/api-client)
test -z "$generated_status" || {
  printf '%s\n' "$generated_status"
  git diff -- sigweft.schema.json web/openapi.json web/src/lib/api-client
  exit 1
}
''',
  { task = "//web:fmt-check" },
  "pnpm --dir web run lint",
  "pnpm --dir web run build",
  { task = "backend" },
]

[tasks.test]
run = ["go vet ./...", "go test -race -count=1 ./..."]

[tasks.format]
run = ["go fmt ./...", "oxfmt ."]

[tasks.fmt-check]
run = ["test -z \"$(gofmt -l cmd internal web/*.go)\"", "oxfmt --check ."]

[tasks.lint]
run = "golangci-lint run"

[tasks.lint-fix]
run = "golangci-lint run --fix"

[tasks.tidy]
run = "go mod tidy"

[tasks.tidy-check]
run = "go mod tidy -diff"

[tasks.vulncheck]
run = "govulncheck ./..."

[tasks.check]
run = [
  { task = "frontend-check" },
  { task = "fmt-check" },
  { task = "lint" },
  { task = "tidy-check" },
  { task = "test" },
  { task = "validate" },
]

[tasks.container-build]
run = 'docker build --build-arg GO_VERSION="$(mise config get tools.go)" --build-arg NODE_VERSION="$(mise config get tools.node)" --build-arg GO_LICENSES_VERSION="$(mise tool go:github.com/google/go-licenses/v2 --requested)" -t sigweft:local .'

[hooks]
postinstall = "lefthook install"
